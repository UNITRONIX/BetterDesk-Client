# BetterDesk Client (full / clean desktop) — build + development prerelease.
#
# Builds the official BetterDesk desktop client after each update on master
# (and on desktop/* tags / manual dispatch). Publishes a small prerelease with
# changelog notes about recent development.
#
# Out of scope (intentionally NOT built here):
#   - BetterDesk Support Agent (product_sku=betterdesk-support / incoming-only).
#     Support is produced later by the console Generator from clean templates
#     + custom.txt — never as a separate GitHub Actions bake-in job.
#
name: BetterDesk desktop release

on:
  push:
    branches:
      - master
    tags:
      - "desktop/*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - "PRIVACY"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. desktop/1.5.0 or desktop/dev-manual)"
        required: true
        default: "desktop/dev-manual"

concurrency:
  group: betterdesk-desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "1.5.0"
  # Clean full client only — never bake Support Agent custom.txt in CI.
  PRODUCT: betterdesk-desktop
  PRODUCT_SKU: betterdesk-desktop

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_dev: ${{ steps.meta.outputs.is_dev }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag and changelog range
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          RUN_N="${GITHUB_RUN_NUMBER}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            IS_DEV=true
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            # Tagged desktop/* releases are still prereleases unless name omits "dev"
            if echo "${TAG_NAME}" | grep -Eqi 'dev|nightly|snapshot'; then
              IS_DEV=true
            else
              IS_DEV=false
            fi
          else
            # Push to master → development prerelease per update
            TAG_NAME="desktop/${VERSION}-dev.${RUN_N}-${SHORT_SHA}"
            IS_DEV=true
          fi

          if [ "${IS_DEV}" = "true" ]; then
            RELEASE_NAME="BetterDesk Client ${VERSION} (dev ${RUN_N})"
          else
            RELEASE_NAME="BetterDesk Client ${VERSION}"
          fi

          # Previous BetterDesk desktop tag for changelog (fallback: last 20 commits)
          PREV="$(git describe --tags --abbrev=0 --match 'desktop/*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -z "${PREV}" ]; then
            PREV="$(git rev-list --max-count=1 HEAD~20 2>/dev/null || echo "")"
          fi

          {
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
            echo "is_dev=${IS_DEV}"
            echo "previous_tag=${PREV}"
          } >> "${GITHUB_OUTPUT}"

          echo "tag_name=${TAG_NAME}"
          echo "release_name=${RELEASE_NAME}"
          echo "is_dev=${IS_DEV}"
          echo "previous_tag=${PREV}"

  build:
    needs: prepare
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ needs.prepare.outputs.tag_name }}
    secrets: inherit

  package-clean-and-release:
    name: Package clean BetterDesk Client + release notes
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release metadata
        run: python3 scripts/validate_release_metadata.py --version "${VERSION}"

      - name: Download Windows unsigned
        uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-unsigned-windows-*
          path: dist-raw
          merge-multiple: false

      - name: Download MSI templates
        uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-unsigned-msi-template-*
          path: dist-raw/msi-template-arts
          merge-multiple: true

      - name: Download macOS unsigned
        uses: actions/download-artifact@v4
        with:
          pattern: betterdesk-unsigned-macos-*
          path: dist-raw
          merge-multiple: false

      - name: Download Linux debs
        uses: actions/download-artifact@v4
        with:
          pattern: "betterdesk-${{ env.VERSION }}-*.deb"
          path: dist-raw/linux-debs
          merge-multiple: true

      - name: Download Linux rpms
        uses: actions/download-artifact@v4
        with:
          pattern: "betterdesk-${{ env.VERSION }}-*-rpms"
          path: dist-raw/linux-rpms
          merge-multiple: true

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          pattern: betterdesk-windows-installers-*
          path: dist-raw/windows-installers
          merge-multiple: true

      - name: Normalize BetterDesk layout (full client only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/{windows-x86_64,windows-aarch64,linux-x86_64,linux-aarch64,macos-x86_64,macos-aarch64,msi-template,clean}

          # Windows folders from CI still named rustdesk-unsigned-windows-*
          for arch in x86_64 aarch64; do
            src=$(find dist-raw -maxdepth 2 -type d -name "rustdesk-unsigned-windows-${arch}" | head -n1 || true)
            if [ -n "${src}" ]; then
              cp -a "${src}/." "dist/windows-${arch}/"
              # Prefer betterdesk.exe; fall back to rename rustdesk.exe
              if [ -f "dist/windows-${arch}/rustdesk.exe" ] && [ ! -f "dist/windows-${arch}/betterdesk.exe" ]; then
                mv "dist/windows-${arch}/rustdesk.exe" "dist/windows-${arch}/betterdesk.exe"
              fi
              # Never ship Support Agent bake-in from CI
              rm -f "dist/windows-${arch}/custom.txt"
              tar -C "dist/windows-${arch}" -czf "dist/clean/betterdesk-${VERSION}-windows-${arch}.tar.gz" .
            fi
          done

          # Portable EXE + MSI installers (standard full client, not incoming-only)
          if [ -d dist-raw/windows-installers ]; then
            find dist-raw/windows-installers -type f \( -name 'betterdesk-*.exe' -o -name 'betterdesk-*.msi' \) \
              -exec cp {} dist/clean/ \;
          fi

          if [ -d dist-raw/msi-template-arts ]; then
            find dist-raw/msi-template-arts -name '*.msi' -exec cp {} dist/msi-template/ \;
            for f in dist/msi-template/rustdesk-template-*.msi; do
              [ -f "$f" ] || continue
              base=$(basename "$f" | sed 's/rustdesk-template/betterdesk-template/')
              mv "$f" "dist/msi-template/${base}"
            done
          fi

          for arch in x86_64 aarch64; do
            src=$(find dist-raw -maxdepth 2 -type d -name "betterdesk-unsigned-macos-${arch}" | head -n1 || true)
            if [ -n "${src}" ]; then
              cp -a "${src}/." "dist/macos-${arch}/"
              app_archive=$(find "dist/macos-${arch}" -maxdepth 1 -name '*-app.tar.gz' | head -n1 || true)
              if [ -n "${app_archive}" ]; then
                tar -xzf "${app_archive}" -C "dist/macos-${arch}"
              fi
              find "dist/macos-${arch}" -name custom.txt -delete || true
              # Prefer a named DMG in clean/ when present
              dmg=$(find "dist/macos-${arch}" -maxdepth 1 -name '*.dmg' | head -n1 || true)
              if [ -n "${dmg}" ]; then
                cp "${dmg}" "dist/clean/betterdesk-${VERSION}-macos-${arch}.dmg"
              fi
              tar -C "dist/macos-${arch}" -czf "dist/clean/betterdesk-${VERSION}-macos-${arch}.tar.gz" .
            fi
          done

          for arch in x86_64 aarch64; do
            deb=$(find dist-raw/linux-debs -name "*${arch}*.deb" 2>/dev/null | head -n1 || true)
            if [ -n "${deb}" ]; then
              cp "${deb}" "dist/clean/betterdesk-${VERSION}-linux-${arch}.deb"
              mkdir -p "dist/linux-${arch}"
              if command -v dpkg-deb >/dev/null; then
                dpkg-deb -x "${deb}" "dist/linux-${arch}/root"
                bin=$(find "dist/linux-${arch}/root" -type f \( -name betterdesk -o -name rustdesk \) | head -n1 || true)
                if [ -n "${bin}" ]; then
                  stage="dist/linux-${arch}/portable"
                  mkdir -p "${stage}"
                  cp -a "$(dirname "${bin}")/." "${stage}/"
                  if [ -f "${stage}/rustdesk" ] && [ ! -f "${stage}/betterdesk" ]; then
                    mv "${stage}/rustdesk" "${stage}/betterdesk"
                  fi
                  rm -f "${stage}/custom.txt"
                  tar -C "${stage}" -czf "dist/clean/betterdesk-${VERSION}-linux-${arch}-portable.tar.gz" .
                fi
              else
                echo "placeholder" > "dist/linux-${arch}/README.txt"
              fi
            fi
            # Fedora / openSUSE RPMs when present
            if [ -d dist-raw/linux-rpms ]; then
              rpm=$(find dist-raw/linux-rpms -name "*${arch}*.rpm" ! -name '*-suse.rpm' 2>/dev/null | head -n1 || true)
              suse=$(find dist-raw/linux-rpms -name "*${arch}*-suse.rpm" 2>/dev/null | head -n1 || true)
              [ -n "${rpm}" ] && cp "${rpm}" "dist/clean/betterdesk-${VERSION}-linux-${arch}.rpm"
              [ -n "${suse}" ] && cp "${suse}" "dist/clean/betterdesk-${VERSION}-linux-${arch}-suse.rpm"
            fi
          done

          # Guard: never publish Support Agent bake-ins from CI
          if find dist/clean dist/msi-template dist/generator-templates* \
              \( -iname '*betterdesk-support*' -o -iname '*incoming-only*' -o -name 'custom.txt' \) \
              2>/dev/null | grep -q .; then
            echo "Refusing to publish Support Agent / bake-in artifacts from CI:" >&2
            find dist/clean dist/msi-template dist/generator-templates* \
              \( -iname '*betterdesk-support*' -o -iname '*incoming-only*' -o -name 'custom.txt' \) \
              2>/dev/null >&2 || true
            exit 1
          fi

          ls -laR dist > dist-layout.txt
          head -n 200 dist-layout.txt

      - name: Pack generator templates (clean binaries only)
        shell: bash
        run: |
          python3 scripts/test_generator_contract.py
          # Templates are clean trees for the console Generator — not a Support build.
          # Support Agent custom.txt is applied by the panel, never in this workflow.
          python3 scripts/pack_generator_templates.py \
            --dist-root dist \
            --out dist/generator-templates \
            --version "${VERSION}" \
            --archive
          python3 scripts/validate_generator_templates.py --root dist/generator-templates
          cp dist/generator-templates-*.tar.gz dist/clean/
          cp dist/generator-templates-*.tar.gz.sha256 dist/clean/
          cp dist/generator-templates/manifest.json dist/clean/betterdesk-${VERSION}-generator-manifest.json

      - name: Write clean desktop manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          root = Path("dist/clean")
          assets = []
          for p in sorted(root.glob("betterdesk-*")):
              if p.name.endswith("manifest.json"):
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assets.append({"name": p.name, "sha256": h, "size": p.stat().st_size})
          manifest = {
              "schema_version": 1,
              "product": os.environ.get("PRODUCT", "betterdesk-desktop"),
              "sku": os.environ.get("PRODUCT_SKU", "betterdesk-desktop"),
              "variant": "clean",
              "version": version,
              "note": (
                  "Official BetterDesk Client (full). No custom.txt / no Support Agent bake-in. "
                  "Configure Settings → Network or use console Generator templates for Support."
              ),
              "assets": assets,
          }
          Path("dist/clean/betterdesk-desktop-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Build release notes
        id: notes
        shell: bash
        env:
          PREV: ${{ needs.prepare.outputs.previous_tag }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          IS_DEV: ${{ needs.prepare.outputs.is_dev }}
        run: |
          set -euo pipefail
          RANGE="${GITHUB_SHA}"
          if [ -n "${PREV}" ]; then
            RANGE="${PREV}..${GITHUB_SHA}"
          fi

          {
            echo "## ${RELEASE_NAME}"
            echo
            echo "Official **BetterDesk Client** development build (\`product_sku=betterdesk-desktop\`)."
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tag: \`${TAG_NAME}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### Scope"
            echo
            echo "- ✅ Full / clean desktop agents: Windows / Linux / macOS (x86_64 + aarch64 when available)"
            echo "- ✅ Installers (MSI / EXE / DEB / RPM / DMG) and portable archives — **no** incoming-only bake-in"
            echo "- ✅ Generator templates (clean binaries for the console — no \`custom.txt\`)"
            echo "- ❌ BetterDesk Support Agent is **not** built in GitHub Actions (panel Generator + \`custom.txt\` only)"
            echo "- ❌ No Android / iOS / AppImage / Flatpak / Sciter / web CI jobs"
            echo
            echo "### Development changes"
            echo
            if git rev-parse --verify "${PREV}" >/dev/null 2>&1 || git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
              git log --pretty=format:'- %s (%h)' "${RANGE}" | head -n 80
              echo
            else
              git log --pretty=format:'- %s (%h)' -n 20
              echo
            fi
            echo
            echo "### Notes"
            echo
            echo "- Unsigned CI artifacts (prerelease)."
            echo "- Configure servers in Settings → Network, or import a deploy string from the BetterDesk panel."
            if [ "${IS_DEV}" = "true" ]; then
              echo "- This is a **development prerelease** published after an update on \`master\`."
            fi
          } > release-notes.md

          echo "Wrote release-notes.md"
          head -n 40 release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release-notes.md
          prerelease: true
          make_latest: ${{ needs.prepare.outputs.is_dev != 'true' }}
          files: |
            dist/clean/*
            dist/msi-template/*
            dist/generator-templates-*.tar.gz
            dist/generator-templates-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
